name: Build JianYing Draft Generator EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --add-data "draft_content_template.json;pyJianYingDraftMixed" jianying-draft-generator.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: jianying-draft-generator
        path: dist/jianying-draft-generator.exe
