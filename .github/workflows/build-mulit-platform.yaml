name: Build JianYing Draft Generator - Cross Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build for Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE (Windows)
      run: |
        pyinstaller --onefile --add-data "draft_content_template.json;pyJianYingDraftMixed" jianying-draft-generator.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jianying-draft-generator-windows
        path: dist/jianying-draft-generator.exe

  build-macos:
    runs-on: macos-latest
    name: Build for macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build binary (macOS)
      run: |
        pyinstaller --onefile --add-data "draft_content_template.json:pyJianYingDraftMixed" jianying-draft-generator.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jianying-draft-generator-macos
        path: dist/jianying-draft-generator

  build-linux:
    runs-on: ubuntu-20.04
    name: Build for Linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libmediainfo-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build binary (Linux)
      run: |
        pyinstaller --onefile --add-data "draft_content_template.json:pyJianYingDraftMixed" jianying-draft-generator.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jianying-draft-generator-linux
        path: dist/jianying-draft-generator
